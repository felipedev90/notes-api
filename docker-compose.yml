services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://notes_user:Senha*123@postgres:5432/notes_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: Senha*123
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: sua_senha
      POSTGRES_DB: notes_test_db
    ports:
    - "5433:5432"

volumes:
  db-data:
