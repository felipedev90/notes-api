services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: Senha*123
      POSTGRES_DB: notes_db
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
