name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://notes_user:test_pass@localhost:5432/notes_test_db

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://notes_user:test_pass@localhost:5432/notes_test_db
          JWT_SECRET: test-secret-for-ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://notes_user:test_pass@localhost:5432/notes_test_db
          JWT_SECRET: test-secret-for-ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notes_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: notes_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
